name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile the toolkit
        run: python -m compileall -q plugins/stm32cubemx-control/scripts
      - name: Repository checks
        run: python tests/test_packaging.py
      - name: Toolkit tests
        run: python plugins/stm32cubemx-control/tests/test_cubemx.py
